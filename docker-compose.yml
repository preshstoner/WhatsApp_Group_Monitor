version: '3.8'

networks:
  monitoring:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: wa_postgres
    restart: always
    environment:
      POSTGRES_USER: wa_user
      POSTGRES_PASSWORD: wa_secure_password
      POSTGRES_DB: whatsapp_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_user -d whatsapp_monitor"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wa_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - monitoring

  evolution-api:
    image: local-evolution-api:latest
    container_name: wa_evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://wa_user:wa_secure_password@postgres:5432/whatsapp_monitor?schema=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - AUTHENTICATION_API_KEY=NBASUPERSECRETKEY
    depends_on:
      - postgres
      - redis
    networks:
      - monitoring

  fastapi:
    build: .
    container_name: wa_fastapi
    restart: always
    ports:
      - "8000:8000"  # (or 8000:8000 depending on your setup)
    volumes:
      - .:/app # <--- THIS IS THE MISSING LINK
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql://wa_user:wa_secure_password@postgres:5432/whatsapp_monitor
      - PG_DSN=postgresql://wa_user:wa_secure_password@postgres:5432/whatsapp_monitor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - monitoring

  php_frontend:
    image: php:8.2-cli
    container_name: wa_php_frontend
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./web-server:/var/www/html
    ports:
      - "8082:8082"
    command: ["php", "-S", "0.0.0.0:8082", "-t", "/var/www/html"]
    networks:
      - monitoring


volumes:
  postgres_data:
  redis_data: